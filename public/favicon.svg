<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0a0a0f"/>
  <g stroke="#c4c4b5" stroke-width="1.5" stroke-linecap="round">
    <!-- Perspective lines converging to center -->
    <line x1="0" y1="0" x2="50" y2="50" opacity="0.25"/>
    <line x1="100" y1="0" x2="50" y2="50" opacity="0.25"/>
    <line x1="0" y1="100" x2="50" y2="50" opacity="0.25"/>
    <line x1="100" y1="100" x2="50" y2="50" opacity="0.25"/>
    <line x1="50" y1="0" x2="50" y2="50" opacity="0.4"/>
    <line x1="50" y1="100" x2="50" y2="50" opacity="0.4"/>
    <line x1="0" y1="50" x2="50" y2="50" opacity="0.4"/>
    <line x1="100" y1="50" x2="50" y2="50" opacity="0.4"/>
    <!-- Center eye / vanishing point -->
    <circle cx="50" cy="50" r="8" fill="none" stroke="#c4c4b5" stroke-width="2" opacity="0.9"/>
    <circle cx="50" cy="50" r="3" fill="#c4c4b5" opacity="0.9"/>
    <circle cx="50" cy="50" r="1" fill="#0a0a0f"/>
  </g>
</svg>